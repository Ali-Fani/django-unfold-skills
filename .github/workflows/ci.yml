name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill frontmatter
        run: python scripts/lint_skills.py

      - name: Compile snippets
        run: |
          import subprocess, sys
          files = [
            "snippets/settings.py", "snippets/model_admin.py", "snippets/dashboard.py",
            "snippets/filters.py", "snippets/actions.py", "snippets/navigation.py",
            "snippets/components.py",
          ]
          sys.exit(subprocess.call([sys.executable, "-m", "py_compile", *files]))
        shell: python
